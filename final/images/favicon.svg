<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
    <!-- Cercle extérieur -->
    <circle cx="100" cy="100" r="95" fill="#1a3a5c"/>
    <circle cx="100" cy="100" r="88" fill="none" stroke="#c8963e" stroke-width="3"/>
    
    <!-- Molécule centrale -->
    <circle cx="100" cy="85" r="12" fill="#c8963e"/>
    <circle cx="75" cy="115" r="10" fill="#2a7f6e"/>
    <circle cx="125" cy="115" r="10" fill="#2a7f6e"/>
    
    <!-- Liaisons moléculaires -->
    <line x1="100" y1="97" x2="75" y2="105" stroke="#c8963e" stroke-width="3"/>
    <line x1="100" y1="97" x2="125" y2="105" stroke="#c8963e" stroke-width="3"/>
    <line x1="85" y1="115" x2="115" y2="115" stroke="#c8963e" stroke-width="2" opacity="0.5"/>
    
    <!-- Petites molécules en orbite -->
    <circle cx="55" cy="70" r="6" fill="#c8963e" opacity="0.6"/>
    <circle cx="145" cy="70" r="6" fill="#c8963e" opacity="0.6"/>
    <circle cx="55" cy="130" r="6" fill="#c8963e" opacity="0.6"/>
    <circle cx="145" cy="130" r="6" fill="#c8963e" opacity="0.6"/>
    
    <!-- Traits de liaison -->
    <line x1="61" y1="70" x2="88" y2="82" stroke="#c8963e" stroke-width="1.5" opacity="0.4"/>
    <line x1="139" y1="70" x2="112" y2="82" stroke="#c8963e" stroke-width="1.5" opacity="0.4"/>
    <line x1="61" y1="130" x2="88" y2="118" stroke="#c8963e" stroke-width="1.5" opacity="0.4"/>
    <line x1="139" y1="130" x2="112" y2="118" stroke="#c8963e" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Étoile (innovation) -->
    <polygon points="100,50 103,58 112,58 105,64 108,73 100,68 92,73 95,64 88,58 97,58" fill="#c8963e" opacity="0.8"/>
    
    <!-- Texte -->
    <text x="100" y="170" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold" letter-spacing="1.5">DRC RESEARCH HUB</text>
    <text x="100" y="186" font-family="Arial, sans-serif" font-size="8" fill="#c8963e" text-anchor="middle" letter-spacing="2">ENERGY · MATERIALS</text>
</svg>